<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>토요일 합격 보드</title>
<style>
/* 칸을 누를 때마다 빈칸 → 합격 → 불합격 → 빈칸. 다른 기기에도 바로 반영된다 */
:root{
  --bg:#0f1b2d; --panel:#16263d; --line:#25395a; --ink:#f3f1ea; --sub:#9fb0c8;
  --gold:#d9b25f; --on-gold:#14213a; --pass:#2fbf71; --pass-bg:#123a28; --fail:#ff6b6b; --fail-bg:#3d1a1f; --wait:#6b7f9c;
  --rh:clamp(32px,calc((100vh - 176px) / 18),58px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f2ea; --panel:#ffffff; --line:#dcd3c1; --ink:#1b2a41; --sub:#5f6a7d;
  --gold:#9a6f1c; --on-gold:#ffffff; --pass:#157a43; --pass-bg:#dcf1e3; --fail:#b9282b; --fail-bg:#f9dede; --wait:#8f98a6;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.5px}
.clock{font-size:clamp(22px,2.6vw,36px);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.tabs,.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools{margin-left:auto;align-items:center}
.tabs button,.tools button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:16px;min-height:44px;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:800}
.sync{font-size:14px;color:var(--sub)}
.sync.ok{color:var(--pass)} .sync.bad{color:var(--fail)}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding-block:12px;align-items:start}
main.one{grid-template-columns:minmax(0,1fr);--rh:clamp(44px,8vh,84px)}
main>div{display:grid;gap:14px;min-width:0}
.box h2{margin:0 0 4px;font-size:clamp(18px,1.9vw,26px);color:var(--gold)}
.box h2 small{font-size:.65em;color:var(--sub);font-weight:600;margin-left:6px}
table{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed}
th{font-size:clamp(13px,1.15vw,17px);color:var(--ink);font-weight:800;padding:2px 3px;text-align:center;vertical-align:bottom;line-height:1.2;word-break:keep-all}
th small{display:block;font-weight:500;color:var(--sub);font-size:.8em}
th .cnt{display:block;font-weight:700;font-size:.82em;color:var(--sub);font-variant-numeric:tabular-nums}
th .cnt b{font-weight:800} th .cnt .p{color:var(--pass)} th .cnt .f{color:var(--fail)}
th.nm{width:clamp(72px,22%,150px)}
td{background:var(--panel);padding:2px 3px;height:var(--rh);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td.nm{font-weight:800;font-size:clamp(15px,calc(var(--rh) * .44),30px);padding-left:10px;border-left:1px solid var(--line);border-radius:8px 0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.mark{display:block;width:100%;height:100%;min-height:calc(var(--rh) - 6px);border:0;border-radius:6px;background:transparent;color:var(--wait);font-weight:800;font-size:clamp(14px,calc(var(--rh) * .42),30px);cursor:pointer;padding:0;touch-action:manipulation}
.mark.p{background:var(--pass-bg);color:var(--pass)}
.mark.f{background:var(--fail-bg);color:var(--fail)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.hint{color:var(--sub);font-size:15px;padding-block:0 12px;margin:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(460px,100%)}
.card h3{margin:0 0 8px}
.card textarea{width:100%;height:280px;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit}
.card button{width:100%;margin-top:8px;min-height:46px;font-size:17px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);--rh:44px}.tools{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>10월 31일(토) 합격 보드</h1>
  <span class="clock" id="clock"></span>
  <div class="tabs" id="tabs" aria-label="보여줄 반"></div>
  <div class="tools">
    <span class="sync" id="sync">연동 준비 중</span>
    <button id="themeBtn" type="button">밝게</button>
    <button id="copyBtn" type="button">결과 복사</button>
  </div>
</header>
<main id="main"></main>
<p class="hint">칸을 누르면 합격 → 불합격 → 빈칸 순서로 바뀝니다. 재시에 통과하면 그 칸을 다시 눌러 합격으로 바꿉니다 · 재시는 매시 30분</p>

<div class="scrim" id="copyBox" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <h3 id="cTitle">결과 복사</h3>
    <textarea id="cText" readonly></textarea>
    <button id="cClose" type="button">닫기</button>
  </div>
</div>

<script>
const KEY = "daol105_sat_pf_20261031";
const RELAY = "https://ntfy.envs.net/daol105-satpf-20261031-k7m2x9q4";
// 명단·시험 — 점수체크란_화목토(10/28~11/3)와 학생타임라인 10/31 기준. 재시 결과는 같은 칸을 고쳐 넣는다
const CLASSES = [
  { id: "g3", name: "중3", time: "4:00~8:30",
    students: ["권순표", "김서율", "김서하", "김영경", "박세현", "선예진", "신하람", "오재원", "우채원",
      "이윤서(하남중)", "이효인", "임주원", "정가람", "정기훈", "최아인", "최정원", "최주원"],
    tests: [
      { id: "eng", name: "8과 영작", sub: "TEST" },
      { id: "wb1", name: "8과 워크북1", sub: "TEST" },
      { id: "wb2", name: "8과 워크북2", sub: "TEST" },
    ] },
  { id: "g1", name: "중1 B반", time: "4:30~8:30",
    students: ["김도윤", "우아윤"],
    tests: [
      { id: "voc", name: "어휘 누적", sub: "해커스 중학필수 5~12" },
      { id: "lis", name: "듣기", sub: "레벨3 14회" },
      { id: "wb", name: "쓰기자신감", sub: "11과 워크북" },
      { id: "rev", name: "복습TEST", sub: "미니모고 22회 10~15번" },
    ] },
  { id: "g2", name: "중2", time: "5:30~9:00",
    students: ["문시윤", "이효준", "정현준"],
    tests: [
      { id: "lis", name: "수능듣기", sub: "26회차" },
      { id: "voc", name: "어휘 누적", sub: "어원편 16~21 · 정현준 고교기본편" },
      { id: "wb", name: "쓰기자신감", sub: "6과 워크북" },
      { id: "rev", name: "복습TEST", sub: "미니모고 22회 10~15번" },
    ] },
];
const LABEL = { p: "합격", f: "불합격" };
const NEXT = { "": "p", p: "f", f: "" };

const $ = (id) => document.getElementById(id);
const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const write = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장이 막힌 환경 — 화면은 그대로 동작 */ } };
const load = () => { try { return JSON.parse(read(KEY)) || {}; } catch (e) { return {}; } };
const cellKey = (c, k, t) => `${c}:${k}:${t}`;
const uid = Math.random().toString(36).slice(2, 10);

let cells = load();                      // { "g3:0:eng": { v: "p", ts: 1730000000000 } }
let view = ["g1", "g2", "g3"].includes(location.hash.slice(1)) ? location.hash.slice(1) : (read(KEY + "_view") || "all");
const save = () => write(KEY, JSON.stringify(cells));
const valueOf = (c, k, t) => (cells[cellKey(c, k, t)] || {}).v || "";

function tableHtml(cls) {
  const head = cls.tests.map((t) => {
    const vals = cls.students.map((_, k) => valueOf(cls.id, k, t.id));
    const p = vals.filter((v) => v === "p").length, f = vals.filter((v) => v === "f").length;
    return `<th>${t.name}<small>${t.sub}</small><span class="cnt"><b class="p">합격 ${p}</b> · <b class="f">불합격 ${f}</b></span></th>`;
  }).join("");
  const rows = cls.students.map((n, k) => {
    const marks = cls.tests.map((t) => {
      const v = valueOf(cls.id, k, t.id);
      const key = cellKey(cls.id, k, t.id);
      return `<td><button type="button" class="mark ${v}" data-c="${cls.id}" data-k="${k}" data-t="${t.id}" id="m-${key}" aria-label="${n} ${t.name} ${LABEL[v] || "미입력"}">${LABEL[v] || "—"}</button></td>`;
    }).join("");
    return `<tr><td class="nm">${n}</td>${marks}</tr>`;
  }).join("");
  return `<section class="box"><h2>${cls.name}<small>${cls.students.length}명 · ${cls.time}</small></h2>` +
    `<table><thead><tr><th class="nm">이름</th>${head}</tr></thead><tbody>${rows}</tbody></table></section>`;
}
function render() {
  const focused = document.activeElement && document.activeElement.id;
  const opts = [["all", "전체"], ...CLASSES.map((c) => [c.id, c.name])];
  $("tabs").innerHTML = opts.map(([id, l]) => `<button type="button" data-v="${id}" class="${view === id ? "on" : ""}">${l}</button>`).join("");
  const one = CLASSES.find((c) => c.id === view);
  $("main").className = one ? "one" : "";
  $("main").innerHTML = one
    ? `<div>${tableHtml(one)}</div>`
    : `<div>${tableHtml(CLASSES[0])}</div><div>${CLASSES.slice(1).map(tableHtml).join("")}</div>`;
  if (focused && $(focused)) $(focused).focus();
}
function renderClock() {
  $("clock").textContent = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  view = b.dataset.v; write(KEY + "_view", view);
  history.replaceState(null, "", view === "all" ? location.pathname : `#${view}`);
  render();
});
$("main").addEventListener("click", (e) => {
  const b = e.target.closest("button.mark");
  if (!b) return;
  const { c, t } = b.dataset, k = Number(b.dataset.k);
  const rec = { v: NEXT[valueOf(c, k, t)], ts: Date.now() };
  cells = { ...cells, [cellKey(c, k, t)]: rec };
  save(); render(); send(c, k, t, rec);
});

// ── 연동 — 칸마다 입력 시각(ts)을 같이 보내고, 받는 쪽은 더 늦은 값만 쓴다 ──
const mine = new Set();
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
function flash(t, ok) { $("sync").textContent = t; $("sync").className = "sync " + (ok ? "ok" : "bad"); }
async function send(c, k, t, rec) {
  const u = `${uid}-${rec.ts}`;
  mine.add(u);
  for (let tries = 0, gap = 3000; tries < 6; tries++, gap *= 2) {
    if ((cells[cellKey(c, k, t)] || {}).ts !== rec.ts) return;   // 그새 더 새 입력이 있으면 옛 값은 보내지 않는다
    try {
      const res = await fetch(RELAY, { method: "POST", body: JSON.stringify({ u, c, k, t, v: rec.v, ts: rec.ts }) });
      if (res.ok) { flash("연동 중 ✓", true); return; }
    } catch (e) { /* 인터넷이 끊겼으면 다시 시도 */ }
    flash("전송 대기 — 다시 보내는 중", false);
    await wait(gap);
  }
  flash("⚠ 전송 실패 — 이 기기 화면에만 남아 있습니다", false);
}
function valid(m) {
  const cls = m && CLASSES.find((x) => x.id === m.c);
  return Boolean(cls) && Number.isInteger(m.k) && m.k >= 0 && m.k < cls.students.length &&
    cls.tests.some((t) => t.id === m.t) && ["", "p", "f"].includes(m.v) && Number.isFinite(m.ts);
}
function applyRemote(m) {
  if (!valid(m) || mine.has(m.u)) return false;
  const key = cellKey(m.c, m.k, m.t);
  if (m.ts <= ((cells[key] || {}).ts || 0)) return false;        // 이 기기에 더 새 값이 있으면 무시
  cells = { ...cells, [key]: { v: m.v, ts: m.ts } };
  return true;
}
function connect() {
  if (!("EventSource" in window)) { flash("이 브라우저는 실시간 연동을 지원하지 않습니다", false); return; }
  const from = Math.floor((Date.now() - 12 * 3600 * 1000) / 1000);
  const es = new EventSource(`${RELAY}/sse?since=${from}`);
  es.onmessage = (ev) => {
    try {
      const outer = JSON.parse(ev.data);
      if (outer.event === "message" && applyRemote(JSON.parse(outer.message))) { save(); render(); }
    } catch (e) { /* 깨진 메시지는 무시 */ }
  };
  es.onopen = () => flash("연동 중 ✓", true);
  es.onerror = () => flash("연동 다시 잇는 중…", false);
}

// ── 기타 ──
const applyTheme = (t) => {
  if (t === "light") document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = t === "light" ? "어둡게" : "밝게";
};
applyTheme(read(KEY + "_theme"));
$("themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  applyTheme(t); write(KEY + "_theme", t);
};

function resultText() {
  const lines = [`[토요일 합격 보드 ${new Date().toLocaleString("ko-KR")}]`];
  CLASSES.forEach((cls) => {
    lines.push("", cls.name);
    cls.students.forEach((n, k) => {
      const parts = cls.tests.map((t) => `${t.name} ${LABEL[valueOf(cls.id, k, t.id)] || "미입력"}`);
      lines.push(`${n} : ${parts.join(" / ")}`);
    });
  });
  return lines.join("\n");
}
$("copyBtn").onclick = async () => {
  const txt = resultText();
  try {
    await navigator.clipboard.writeText(txt);
    $("copyBtn").textContent = "복사됨 ✓";
    setTimeout(() => { $("copyBtn").textContent = "결과 복사"; }, 3000);
  } catch (e) { $("cText").value = txt; $("copyBox").hidden = false; $("cText").select(); }
};
$("cClose").onclick = () => { $("copyBox").hidden = true; };

const keepAwake = async () => { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) { /* 허용 안 되면 그대로 */ } };
document.addEventListener("click", keepAwake, { once: true });

render();
renderClock();
setInterval(renderClock, 20000);
connect();
</script>
</body>
</html>
