<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>중3 토요일 TEST 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 오늘 순서(시각 강조) · 오른쪽 학생별 통과/불통 표 — 프로젝터 거리에서 읽히는 큰 글씨 */
:root{
  --bg:#0f1b2d; --panel:#16263d; --line:#25395a; --ink:#f3f1ea; --sub:#9fb0c8;
  --gold:#d9b25f; --on-gold:#14213a; --pass:#2fbf71; --pass-bg:#123a28; --fail:#ff6b6b; --fail-bg:#3d1a1f; --half:#f0b54a; --half-bg:#3b2e12;
  --wait:#6b7f9c; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f2ea; --panel:#ffffff; --line:#dcd3c1; --ink:#1b2a41; --sub:#5f6a7d;
  --gold:#9a6f1c; --on-gold:#ffffff; --pass:#157a43; --pass-bg:#dcf1e3; --fail:#b9282b; --fail-bg:#f9dede; --half:#9a5b00; --half-bg:#fbedcf;
  --wait:#8f98a6; --scrim:rgba(0,0,0,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sync{font-size:14px;color:var(--sub)}
.sync.ok{color:var(--pass)} .sync.bad{color:var(--fail)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px;border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.5px}
header .date{color:var(--sub);font-size:clamp(15px,1.5vw,20px)}
header .clock{margin-left:auto;font-size:clamp(28px,3.6vw,46px);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
header .btns{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit}
header button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer;min-height:44px}
header button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
button:focus-visible,td.cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding-block:16px}
main>section{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{margin:0 0 8px;font-size:18px;color:var(--gold)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tl li{display:flex;gap:12px;padding:9px 10px;border-radius:10px;font-size:18px;align-items:baseline}
.tl li .t{min-width:56px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub)}
.tl li.done{opacity:.4}
.tl li.now{background:var(--gold);color:var(--on-gold)}
.tl li.now .t{color:var(--on-gold)}
.tl small{display:block;font-size:13px;opacity:.85}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum .k{font-size:15px;color:var(--sub)}
.sum .v{font-size:clamp(16px,1.7vw,24px);font-weight:800;margin-top:2px;line-height:1.35}
.sum .p{color:var(--pass)} .sum .f{color:var(--fail)} .sum .n{font-size:15px;color:var(--sub);font-weight:600}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 5px}
th{font-size:15px;color:var(--sub);text-align:center;font-weight:700;padding:0 6px}
th:first-child{text-align:left}
th small{font-weight:600}
td{background:var(--panel);padding:5px 6px;text-align:center;font-size:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td:first-child{text-align:left;font-weight:800;border-left:1px solid var(--line);border-radius:10px 0 0 10px;padding-left:14px;font-size:clamp(18px,2vw,24px);white-space:nowrap}
td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.badge{display:inline-flex;align-items:baseline;gap:6px;min-width:110px;justify-content:center;padding:4px 10px;border-radius:999px;font-weight:800;font-size:clamp(16px,1.7vw,20px)}
.badge.p{background:var(--pass-bg);color:var(--pass)}
.badge.f{background:var(--fail-bg);color:var(--fail)}
.badge.h{background:var(--half-bg);color:var(--half)}
.sum .h{color:var(--half)}
.badge.w{color:var(--wait)}
.badge small{font-weight:600;font-size:14px;opacity:.9}
table.edit td.cell{cursor:pointer}
table.edit td.cell:hover{outline:2px solid var(--gold);outline-offset:-2px}
.hint{color:var(--sub);font-size:15px;margin-top:6px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pick button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:16px;min-height:42px;cursor:pointer}
.pick button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
table.only th.c:not(.sel), table.only td.cell:not(.sel){display:none}
.edrow{display:flex;gap:6px;align-items:center;justify-content:center}
.edrow .in{width:4.2em;font-size:22px;padding:6px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;font-family:inherit;min-height:44px}
.edrow .in.re,.edrow .in.fx{width:4.6em;font-size:17px}
.edrow .allok{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass);border-radius:8px;padding:6px 8px;font-size:15px;font-weight:800;min-height:44px;cursor:pointer;white-space:nowrap}
.badge.rp{background:var(--pass-bg);color:var(--pass);outline:2px solid var(--pass)}
.badge.rf{background:var(--fail-bg);color:var(--fail);outline:2px solid var(--fail)}
.badge.x{background:var(--fail-bg);color:var(--fail);outline:2px dashed var(--fail)}
.edrow .live{cursor:pointer}
.edrow .badge{min-width:76px}
/* 입력 창 (페이지 안에 그리는 창 — 알림창은 쓰지 않는다) */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,100%)}
.card h3{margin:0 0 4px;font-size:24px}
.card p{margin:0 0 10px;color:var(--sub)}
.card label{display:block;font-size:15px;color:var(--sub);margin:10px 0 4px}
.card input,.card textarea{width:100%;font-size:26px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.card textarea{font-size:17px;height:180px}
#cText{height:260px;font-size:15px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button{flex:1;font-size:18px;min-height:50px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.row .ok{background:var(--pass);color:#fff;border:none}
.row .no{background:var(--fail);color:#fff;border:none}
.row .half{background:var(--half);color:#1b1205;border:none}
.row .warn{color:var(--fail)}
@media (max-width:760px){main{grid-template-columns:1fr}.summary{grid-template-columns:1fr}
  body.editing .panel, body.editing .summary{display:none}
  header h1{font-size:20px} header .date{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header>
  <h1>중3 토요일 · 7과 TEST</h1>
  <span class="date" id="date"></span>
  <span class="clock" id="clock"></span>
  <div class="btns">
    <button id="modeBtn" type="button">입력 모드</button>
    <button id="themeBtn" type="button">밝게</button>
    <button id="setBtn" type="button">설정</button>
    <button id="copyBtn" type="button">결과 복사</button>
  </div>
  <span class="sync" id="sync">연동 준비 중</span>
</header>
<main>
  <section class="panel" aria-label="오늘 순서">
    <h2>오늘 순서</h2>
    <ul class="tl" id="tl"></ul>
  </section>
  <section>
    <div class="summary" id="summary"></div>
    <div class="pick" id="pick" aria-label="보여줄 시험"></div>
    <div class="wrap"><table id="board"><thead></thead><tbody></tbody></table></div>
    <div class="hint" id="hint"></div>
  </section>
</main>

<div class="modal" id="dlg" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <h3 id="dTitle"></h3>
    <p id="dSub"></p>
    <p id="dNow"></p>
    <div class="row">
      <button class="ok" id="dPass" type="button">통과</button>
      <button class="half" id="dHalf" type="button">틀린 문항 재시</button>
      <button class="no" id="dFail" type="button">전체 재시</button>
    </div>
    <div class="row">
      <button id="dUnforce" type="button">감독 판정 풀기</button>
      <button class="warn" id="dClear" type="button">이 칸 비우기</button>
      <button id="dCancel" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="modal" id="settings" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h3 id="sTitle">설정</h3>
    <label for="sRoster">학생 명단 (한 줄에 한 명)</label>
    <textarea id="sRoster"></textarea>
    <label for="sMax">만점(원점수) — 워크북1 · 워크북2 · 영작</label>
    <input id="sMax" type="text">
    <label for="sCut">통과 기준 점수(100점 환산) — 워크북1 · 워크북2 · 영작</label>
    <input id="sCut" type="text">
    <div class="row">
      <button class="warn" id="sReset" type="button">결과 전부 지우기</button>
      <button id="sCancel" type="button">닫기</button>
      <button class="ok" id="sSave" type="button">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="copyBox" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <h3 id="cTitle">결과 복사</h3>
    <p>아래 글을 길게 눌러 전체 선택 → 복사한 뒤 Claude 에게 붙여 넣으세요.</p>
    <textarea id="cText" readonly></textarea>
    <div class="row"><button id="cClose" type="button">닫기</button></div>
  </div>
</div>

<script>
const KEY = "daol105_g9_sat_20261024_v3";
// 연동 통로 — ntfy.sh 가 학원 인터넷에서 막혀(10/24 17시) 다른 공개 서버로 옮겼다
const RELAY = "https://ntfy.envs.net/daol105-g9sat-r8w3n6t2";
// 만점 — 인쇄본(동아윤 7과) 총점: 워크북1 331 · 워크북2 92 · 영작 117 (2026-10-24 확인).
// 원점수를 넣으면 100점으로 환산해 판정한다(80 이상 통과 · 60~79 틀린 문항 재시 · 60 미만 전체 재시).
const TESTS = [
  { id: "wb1", name: "7과 워크북1 TEST", max: 331 },
  { id: "wb2", name: "7과 워크북2 TEST", max: 92 },
  { id: "eng", name: "7과 영작 TEST", max: 117 },
];
const TIMELINE = [
  ["16:00", "17:00", "7과 워크북1 TEST", "1시간"],
  ["17:00", "18:00", "7과 워크북2 TEST", "1시간"],
  ["18:00", "19:00", "7과 영작 TEST", "1시간"],
  ["19:00", "19:20", "고등서술형 2과 워크북", "20분"],
  ["19:20", "20:00", "채점 → 상세해설서 보고 질답", "모르는 문항 질문"],
  ["20:30", "20:50", "재시", "매시 30분"],
  ["21:30", "21:50", "재시", "매시 30분"],
];
const DEFAULT_ROSTER = ["김서율", "김서하", "김영경", "박세현", "선예진", "신하람", "오재원", "우채원",
  "이효인", "임주원", "정기훈", "최아인", "최정원", "최주원"];
const FULL_CUT = 60;
const TIER = { p: "통과", h: "틀린 문항 재시", f: "전체 재시", rp: "재시 통과", rf: "재시 불통", x: "점수 확인" };

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const write = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장이 막힌 환경 — 화면은 그대로 동작 */ } };
const load = () => { try { return JSON.parse(read(KEY)) || null; } catch (e) { return null; } };
const has = (v) => v !== "" && v != null;
const isInt = (v) => /^\d{1,3}$/.test(String(v ?? "").trim());
const okScore = (v, max = 100) => isInt(v) && Number(v) <= max;
const pct = (raw, max) => (Number(raw) * 100) / max;                 // 100점 환산(판정은 소수까지 그대로)
const p1 = (x) => String(Math.floor(x * 10) / 10);                  // 화면 표시 — 소수 한 자리, 올리지 않는다
const maxOf = (i) => Number((state.max || [])[i]) || TESTS[i].max;  // 지금 설정된 만점
const recMax = (r) => Number(r && r.m) || 100;                      // 그 칸을 넣을 때의 만점(옛 기록은 100점 기준)
const num = (v) => String(Number(v));               // 「007」 → 「7」
const tierOf = (score, cut) => (score >= cut ? "p" : score >= FULL_CUT ? "h" : "f");
const uid = Math.random().toString(36).slice(2, 10);

let state = load() || { roster: DEFAULT_ROSTER, cut: [80, 80, 80], res: {}, resetAt: 0 };
if (!Array.isArray(state.max)) state = { ...state, max: TESTS.map((t) => t.max) };
// 이전 판(v2)에서 이 기기에 넣어 둔 결과를 옮겨 온다 — 새로고침해도 수업 중 입력이 사라지지 않게
const migrated = [];
if (!read(KEY)) {
  try {
    const old = JSON.parse(read("daol105_g9_sat_20261024_v2") || "null");
    if (old && old.res) {
      const now = Date.now();
      const res = {};
      Object.entries(old.res).forEach(([n, tests]) => {
        res[n] = {};
        Object.entries(tests || {}).forEach(([id, r]) => {
          if (!r || (!has(r.score) && !has(r.retest) && !r.force)) return;
          res[n][id] = { score: r.score ?? "", retest: r.retest ?? "", force: r.force || undefined, ts: now };
          if (!res[n][id].force) delete res[n][id].force;
          migrated.push([n, id]);
        });
      });
      state = { ...state, res, roster: old.roster || state.roster, cut: old.cut || state.cut };
    }
  } catch (e) { /* 옛 기록이 없거나 깨졌으면 새로 시작 */ }
}
let edit = false;
let cur = null;
let resetArmed = false;
const save = () => write(KEY, JSON.stringify(state));

function cellRec(n, i) { return { ...((state.res[n] || {})[TESTS[i].id] || {}) }; }
function setRec(n, i, rec) { state = { ...state, res: { ...state.res, [n]: { ...(state.res[n] || {}), [TESTS[i].id]: rec } } }; }
function delRec(n, i) { const mine = { ...(state.res[n] || {}) }; delete mine[TESTS[i].id]; state = { ...state, res: { ...state.res, [n]: mine } }; }

// 판정 — 본시험 점수 → (감독 판정이 있으면 그 갈래) → 전체 재시 점수 / 틀린 문항 재시 결과
function status(n, i) {
  const r = (state.res[n] || {})[TESTS[i].id];
  if (!r) return null;
  const cut = Number(state.cut[i]);
  let first = null;
  const m = recMax(r);
  if (has(r.score)) { if (!okScore(r.score, m)) return { tier: "x", r }; first = tierOf(pct(r.score, m), cut); }
  const track = r.force === "p" ? "p" : (r.force === "h" || r.force === "f") ? r.force : first;
  if (!track) return null;
  let tier = track;
  if (track === "f" && has(r.retest)) tier = !okScore(r.retest, m) ? "x" : (pct(r.retest, m) >= cut ? "rp" : "rf");
  if (track === "h" && has(r.fix)) tier = !isInt(r.fix) ? "x" : (Number(r.fix) === 0 ? "rp" : "rf");
  return { tier, first, track, r };
}
// 화면 · 결과 복사 · 시스템 오픈메모에 같이 쓰는 설명
function desc(n, i) {
  const s = status(n, i);
  if (!s || s.tier === "x") return "";
  const r = s.r, parts = [], m = recMax(r);
  const sc = (v) => (m === 100 ? `${num(v)}점` : `${num(v)}/${m} (${p1(pct(v, m))}점)`);
  if (has(r.score)) parts.push(sc(r.score));
  if (s.track === "f" && has(r.retest)) parts.push(`전체 재시 ${sc(r.retest)}`);
  if (s.track === "h" && has(r.fix)) parts.push(Number(r.fix) === 0 ? "틀린 문항 재시 다 맞음" : `틀린 문항 재시 ${num(r.fix)}개 또 틀림`);
  const tail = `${TIER[s.tier]}${r.force ? " (감독 판정)" : ""}`;
  return parts.length ? `${parts.join(" → ")} · ${tail}` : tail;
}
function badge(n, i, short) {
  const s = status(n, i);
  if (!s) return `<span class="badge w">${short ? "—" : "대기"}</span>`;
  if (s.tier === "x") return `<span class="badge x">점수 확인</span>`;
  const d = desc(n, i).split(" · ")[0];
  return `<span class="badge ${s.tier}">${TIER[s.tier]}${short || !d || d === TIER[s.tier] ? "" : ` <small>${esc(d)}</small>`}</span>`;
}

const hm = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const disp = (s) => { const [h, m] = s.split(":").map(Number); return `${h > 12 ? h - 12 : h}:${String(m).padStart(2, "0")}`; };
function renderClock() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  $("clock").textContent = now.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
  $("date").textContent = now.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
  $("tl").innerHTML = TIMELINE.map(([a, b, t, n]) => {
    const cls = mins >= hm(b) ? "done" : (mins >= hm(a) ? "now" : "");
    return `<li class="${cls}"><span class="t">${disp(a)}</span><span>${t}<small>${disp(a)}~${disp(b)} · ${n}</small></span></li>`;
  }).join("");
}

// 휴대폰처럼 좁은 화면에서는 시험 하나씩 골라 입력한다
const narrow = window.matchMedia("(max-width: 760px)");
let focusI = narrow.matches ? 0 : -1;
function renderPick() {
  const opts = [...TESTS.map((t, i) => [i, t.name.replace("7과 ", "").replace(" TEST", "")]), [-1, "전체"]];
  $("pick").innerHTML = opts.map(([i, l]) => `<button type="button" data-p="${i}" class="${focusI === i ? "on" : ""}">${l}</button>`).join("");
}
$("pick").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]");
  if (b) { focusI = Number(b.dataset.p); render(); }
});

const cellSel = (n, i) => `td.cell[data-k="${state.roster.indexOf(n)}"][data-i="${i}"]`;
function render() {
  renderClock();
  renderPick();
  const sel = (i) => (focusI === i ? " sel" : "");
  document.querySelector("#board thead").innerHTML =
    `<tr><th>이름</th>${TESTS.map((t, i) => `<th class="c${sel(i)}">${t.name}<br><small>${maxOf(i)}점 만점 · ${Math.ceil(maxOf(i) * Number(state.cut[i]) / 100)}점↑ 통과(${esc(state.cut[i])}점)</small></th>`).join("")}</tr>`;
  $("board").className = (edit ? "edit" : "") + (focusI >= 0 ? " only" : "");
  document.body.classList.toggle("editing", edit);
  document.querySelector("#board tbody").innerHTML = state.roster.map((n, k) => {
    const cells = TESTS.map((t, i) => {
      if (!edit) return `<td class="cell${sel(i)}" data-k="${k}" data-i="${i}">${badge(n, i)}</td>`;
      const r = cellRec(n, i);
      const mx = maxOf(i);
      const inp = (f, cls, ph, lab) => `<input class="in${cls}" data-k="${k}" data-i="${i}" data-f="${f}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="${ph}" value="${esc(r[f])}" aria-label="${esc(n)} ${t.name} ${lab}">`;
      return `<td class="cell ed${sel(i)}" data-k="${k}" data-i="${i}"><div class="edrow">` +
        inp("score", "", `점수/${mx}`, `점수 (${mx}점 만점)`) + inp("retest", " re", `재시/${mx}`, `전체 재시 점수 (${mx}점 만점)`) +
        `<button type="button" class="allok" data-k="${k}" data-i="${i}">다 맞음</button>` +
        inp("fix", " fx", "또 틀림", "틀린 문항 재시에서 또 틀린 개수") +
        `<span class="live" data-k="${k}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(n)} 감독 판정">${badge(n, i, true)}</span></div></td>`;
    }).join("");
    return `<tr><td>${esc(n)}</td>${cells}</tr>`;
  }).join("");
  if (edit) state.roster.forEach((n) => TESTS.forEach((_, i) => showExtras(n, i)));
  renderSummary();
}
// 칸 안 입력 — 전체 재시면 재시점수, 틀린 문항 재시면 다 맞음 / 또 틀림 (감독 판정이 있으면 그 갈래를 따른다)
function showExtras(n, i) {
  const td = document.querySelector(cellSel(n, i));
  if (!td) return;
  const s = status(n, i);
  const track = s ? s.track : null;
  td.querySelector('[data-f="retest"]').hidden = track !== "f";
  td.querySelector('[data-f="fix"]').hidden = track !== "h";
  td.querySelector(".allok").hidden = track !== "h";
}
// 칸 하나만 다시 그림 — 지금 입력 중인 칸의 값은 건드리지 않는다
function updateCell(n, i) {
  const td = document.querySelector(cellSel(n, i));
  if (!td) return;
  if (!edit) { td.innerHTML = badge(n, i); return; }
  const r = cellRec(n, i);
  td.querySelectorAll("input.in").forEach((el) => { if (el !== document.activeElement) el.value = r[el.dataset.f] ?? ""; });
  td.querySelector(".live").innerHTML = badge(n, i, true);
  showExtras(n, i);
}
function renderSummary() {
  $("summary").innerHTML = TESTS.map((t, i) => {
    let p = 0, h = 0, f = 0, rf = 0, x = 0, w = 0;
    state.roster.forEach((n) => {
      const s = status(n, i);
      if (!s) w++; else if (s.tier === "p" || s.tier === "rp") p++; else if (s.tier === "h") h++;
      else if (s.tier === "f") f++; else if (s.tier === "rf") rf++; else x++;
    });
    return `<div class="sum"><div class="k">${t.name}</div><div class="v"><span class="p">통과 ${p}</span> · <span class="h">틀린 문항 재시 ${h}</span> · <span class="f">전체 재시 ${f}</span>` +
      `${rf ? ` · <span class="f">재시 불통 ${rf}</span>` : ""}${x ? ` · <span class="f">점수 확인 ${x}</span>` : ""} <span class="n">· 대기 ${w} / ${state.roster.length}명</span></div></div>`;
  }).join("");
  $("modeBtn").textContent = edit ? "입력 끝내기" : "입력 모드";
  $("modeBtn").classList.toggle("on", edit);
  $("hint").textContent = edit
    ? `점수 칸에는 원점수를 넣습니다(워크북1 ${maxOf(0)} · 워크북2 ${maxOf(1)} · 영작 ${maxOf(2)}점 만점) — 100점으로 환산해 판정합니다. ` + "본시험 점수를 넣으면 바로 판정됩니다. 전체 재시 → 「재시점수」 칸(기준 점수 이상이면 재시 통과). 틀린 문항 재시 → 다 맞으면 「다 맞음」(재시 통과), 또 틀리면 「또 틀림」에 개수(재시 불통). 판정 표시를 누르면 감독이 직접 정합니다."
    : "100점 환산 80점 이상 통과 · 60~79점은 틀린 문항만 재시 · 60점 미만은 전체 재시 — 재시는 매시 30분 (8:30 · 9:30)";
}

// ── 입력 ──
const cellOf = (el) => ({ n: state.roster[Number(el.dataset.k)], i: Number(el.dataset.i) });
document.addEventListener("input", (e) => {
  const el = e.target.closest("input.in");
  if (!el) return;
  el.value = el.value.replace(/\D/g, "").slice(0, 3);         // 숫자만
  const { n, i } = cellOf(el);
  const before = status(n, i);
  const rec = { ...cellRec(n, i), [el.dataset.f]: el.value, ts: Date.now() };
  if (el.dataset.f === "score" || (el.dataset.f === "retest" && !has(rec.score))) rec.m = maxOf(i);   // 재시는 본시험을 넣을 때의 만점을 따른다
  if (el.dataset.f === "score") {
    delete rec.force;                                          // 점수를 다시 넣으면 감독 판정은 풀린다
    setRec(n, i, rec);
    const after = status(n, i);
    // 갈래(전체 재시 ↔ 틀린 문항 재시 ↔ 통과)가 바뀌면 숨은 옛 재시 기록을 지운다
    if (!before || !after || before.track !== after.track) { delete rec.retest; delete rec.fix; setRec(n, i, rec); }
  } else setRec(n, i, rec);
  updateCell(n, i);
  renderSummary();
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("input.in");
  if (!el) return;
  const { n, i } = cellOf(el);
  save(); send(n, i);
});
document.addEventListener("keydown", (e) => {
  const el = e.target.closest && e.target.closest("input.in");
  if (el && e.key === "Enter") { e.preventDefault(); el.blur(); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button.allok");
  if (!b) return;
  const { n, i } = cellOf(b);
  setRec(n, i, { ...cellRec(n, i), fix: "0", ts: Date.now() });
  updateCell(n, i); renderSummary(); save(); send(n, i);
});

// ── 감독 판정 창 ──
function openCell(el) {
  cur = cellOf(el);
  $("dTitle").textContent = cur.n;
  $("dSub").textContent = TESTS[cur.i].name;
  $("dNow").textContent = `지금: ${desc(cur.n, cur.i) || "입력 없음"}`;
  $("dlg").hidden = false;
  $("dCancel").focus();
}
$("board").addEventListener("click", (e) => { const l = e.target.closest(".live"); if (edit && l) openCell(l); });
$("board").addEventListener("keydown", (e) => {
  const l = e.target.closest(".live");
  if (edit && l && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCell(l); }
});
function judge(force) {
  const rec = { ...cellRec(cur.n, cur.i), ts: Date.now() };
  if (force) rec.force = force; else delete rec.force;
  setRec(cur.n, cur.i, rec);
  $("dlg").hidden = true; save(); updateCell(cur.n, cur.i); renderSummary(); send(cur.n, cur.i);
}
$("dPass").onclick = () => judge("p");
$("dHalf").onclick = () => judge("h");
$("dFail").onclick = () => judge("f");
$("dUnforce").onclick = () => judge(null);
$("dClear").onclick = () => {
  delRec(cur.n, cur.i); setRec(cur.n, cur.i, { ts: Date.now() });
  $("dlg").hidden = true; save(); updateCell(cur.n, cur.i); renderSummary(); send(cur.n, cur.i);
};
$("dCancel").onclick = () => { $("dlg").hidden = true; };
$("dlg").addEventListener("keydown", (e) => { if (e.key === "Escape") $("dlg").hidden = true; });

// ── 연동 — 보내기 ──
// 칸마다 마지막 입력 시각(ts)을 같이 보낸다. 받는 쪽은 더 늦은 것만 쓴다 → 늦게 도착한 옛 값이 새 값을 덮지 못한다
const mine = new Set();
async function send(n, i) {
  const k = DEFAULT_ROSTER.indexOf(n);
  if (k < 0) { flash(`${n} 은(는) 기본 명단에 없어 시스템으로 보내지 않습니다`, false); return; }
  const r = cellRec(n, i), s = status(n, i);
  if (s && s.tier === "x") { flash(`${n} 점수를 확인해 주세요 (0~${recMax(r)})`, false); return; }
  const m = recMax(r), to100 = (v) => String(Math.floor(pct(v, m)));
  const id = `${uid}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
  mine.add(id);
  const msg = { u: id, ts: r.ts || Date.now(), k, id: TESTS[i].id, c: Number(state.cut[i]) || 80,
    s: s && has(r.score) ? to100(r.score) : "", f: s ? (r.force || "") : "",
    r: s && s.track === "f" && has(r.retest) ? to100(r.retest) : "", z: s && s.track === "h" && has(r.fix) ? num(r.fix) : "",
    sr: s && has(r.score) ? num(r.score) : "", rr: s && s.track === "f" && has(r.retest) ? num(r.retest) : "", m,
    x: s ? 0 : 1 };
  for (let tries = 0, wait = 3000; tries < 6; tries++, wait *= 2) {
    if ((cellRec(n, i).ts || 0) !== msg.ts) return;           // 그새 더 새 입력이 있으면 옛 값은 보내지 않는다
    try {
      const res = await fetch(RELAY, { method: "POST", body: JSON.stringify(msg) });
      if (res.ok) { flash(`시스템 전송 ✓ ${new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" })}`, true); return; }
    } catch (e) { /* 인터넷이 끊겼으면 다시 시도 */ }
    flash(`전송 대기 — ${n} 다시 보내는 중`, false);
    await new Promise((res) => setTimeout(res, wait));
  }
  flash(`⚠ ${n} 시스템 전송 실패 — 「결과 복사」로 보내 주세요`, false);
}
function flash(t, ok) { $("sync").textContent = t; $("sync").className = "sync " + (ok ? "ok" : "bad"); }

// ── 연동 — 받기 (다른 기기 결과) ──
function valid(m) {
  return m && typeof m === "object" && Number.isInteger(m.k) && m.k >= 0 && m.k < DEFAULT_ROSTER.length &&
    TESTS.some((t) => t.id === m.id) && Number.isFinite(m.ts) &&
    ["", "p", "h", "f"].includes(m.f ?? "") && ["s", "r", "z", "sr", "rr"].every((f) => (m[f] ?? "") === "" || isInt(m[f])) &&
    (m.m == null || (Number.isInteger(m.m) && m.m > 0 && m.m < 1000));
}
function applyRemote(m) {
  if (!valid(m) || mine.has(m.u) || m.ts < (state.resetAt || 0)) return null;
  const n = DEFAULT_ROSTER[m.k], i = TESTS.findIndex((t) => t.id === m.id);
  if (!state.roster.includes(n)) return null;
  if (m.ts <= (cellRec(n, i).ts || 0)) return null;            // 이 기기에 더 새 값이 있으면 무시
  const rec = { ts: m.ts };
  if (!m.x) {
    const raw = Number.isInteger(m.m) && m.m !== 100;
    rec.score = raw ? (m.sr ?? "") : (m.s ?? ""); rec.retest = raw ? (m.rr ?? "") : (m.r ?? ""); rec.fix = m.z ?? "";
    if (raw) rec.m = m.m;
    if (m.f) rec.force = m.f;
  }
  setRec(n, i, rec);
  return [n, i];
}
function afterRemote(cells) {
  save();
  if (!edit) { render(); return; }
  cells.forEach(([n, i]) => updateCell(n, i));
  renderSummary();
}
const seenEv = new Set();
function onEvent(ev) {
  if (!ev || ev.event !== "message" || seenEv.has(ev.id)) return null;
  seenEv.add(ev.id);
  try { return applyRemote(JSON.parse(ev.message)); } catch (e) { return null; }
}
function connect() {
  const from = Math.floor(Math.max(state.resetAt || 0, Date.now() - 12 * 3600 * 1000) / 1000);
  if (!("EventSource" in window)) { flash("이 브라우저는 실시간 연동을 지원하지 않습니다", false); return; }
  const es = new EventSource(`${RELAY}/sse?since=${from}`);
  es.onmessage = (m) => { try { const c = onEvent(JSON.parse(m.data)); if (c) afterRemote([c]); } catch (e) { /* 무시 */ } };
  es.onopen = () => flash("연동 중 ✓", true);
  es.onerror = () => flash("연동 다시 잇는 중…", false);
  window.__es = es;
}

// ── 기타 ──
const keepAwake = async () => { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) { /* 허용 안 되면 그대로 */ } };
$("modeBtn").onclick = () => { edit = !edit; keepAwake(); render(); };
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;      // 입력 중에는 단축키를 쓰지 않는다
  if ((e.key === "e" || e.key === "E") && $("dlg").hidden && $("settings").hidden && $("copyBox").hidden) { edit = !edit; render(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

const applyTheme = (t) => {
  if (t === "light") document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = t === "light" ? "어둡게" : "밝게";
};
applyTheme(read(KEY + "_theme"));
$("themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  applyTheme(t); write(KEY + "_theme", t);
};

$("setBtn").onclick = () => {
  $("sRoster").value = state.roster.join("\n");
  $("sCut").value = state.cut.join(", ");
  $("sMax").value = TESTS.map((_, i) => maxOf(i)).join(", ");
  resetArmed = false; $("sReset").textContent = "결과 전부 지우기";
  $("settings").hidden = false;
};
$("sCancel").onclick = () => { $("settings").hidden = true; };
$("sSave").onclick = () => {
  const roster = $("sRoster").value.split("\n").map((x) => x.trim()).filter(Boolean);
  const cut = $("sCut").value.split(/[,\s]+/).filter(Boolean).map(Number);
  const mx = $("sMax").value.split(/[,\s]+/).filter(Boolean).map(Number);
  state = { ...state, roster, cut: TESTS.map((_, i) => (isNaN(cut[i]) ? 80 : cut[i])),
    max: TESTS.map((t, i) => (Number.isInteger(mx[i]) && mx[i] > 0 && mx[i] < 1000 ? mx[i] : t.max)) };
  $("settings").hidden = true; save(); render();
};
$("sReset").onclick = () => {
  if (!resetArmed) { resetArmed = true; $("sReset").textContent = "한 번 더 누르면 이 기기의 결과를 지웁니다"; return; }
  state = { ...state, res: {}, resetAt: Date.now() };
  $("settings").hidden = true; save(); render();
};

function resultText() {
  const lines = [`[중3 토요일 TEST 결과 ${new Date().toLocaleString("ko-KR")}]`];
  state.roster.forEach((n) => {
    const parts = TESTS.map((t, i) => {
      const s = status(n, i), lab = t.name.replace("7과 ", "").replace(" TEST", "");
      if (s && s.tier === "x") return `${lab} 점수 확인 필요`;
      const d = desc(n, i);
      return d ? `${lab} ${d}` : "";
    }).filter(Boolean);
    if (parts.length) lines.push(`${n} : ${parts.join(" / ")}`);
  });
  return lines.join("\n");
}
$("copyBtn").onclick = async () => {
  const txt = resultText();
  try { await navigator.clipboard.writeText(txt); $("copyBtn").textContent = "복사됨 ✓"; setTimeout(() => { $("copyBtn").textContent = "결과 복사"; }, 3000); }
  catch (e) { $("cText").value = txt; $("copyBox").hidden = false; $("cText").select(); }
};
$("cClose").onclick = () => { $("copyBox").hidden = true; };

render();
setInterval(() => { if (edit) { renderClock(); } else render(); }, 20000);
connect();
// 옮겨 온 결과는 시스템 · 다른 기기로 한 칸씩 천천히 다시 보낸다(요청 제한에 걸리지 않게)
if (migrated.length) {
  save();
  migrated.forEach(([n, id], j) => setTimeout(() => send(n, TESTS.findIndex((t) => t.id === id)), 1500 * (j + 1)));
}
</script>

</body>
</html>
