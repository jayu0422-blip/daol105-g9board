<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>중3 토요일 TEST 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 오늘 순서(시각 강조) · 오른쪽 학생별 통과/불통 표 — 프로젝터 거리에서 읽히는 큰 글씨 */
:root{
  --bg:#0f1b2d; --panel:#16263d; --line:#25395a; --ink:#f3f1ea; --sub:#9fb0c8;
  --gold:#d9b25f; --on-gold:#14213a; --pass:#2fbf71; --pass-bg:#123a28; --fail:#ff6b6b; --fail-bg:#3d1a1f; --half:#f0b54a; --half-bg:#3b2e12;
  --wait:#6b7f9c; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f2ea; --panel:#ffffff; --line:#dcd3c1; --ink:#1b2a41; --sub:#5f6a7d;
  --gold:#9a6f1c; --on-gold:#ffffff; --pass:#157a43; --pass-bg:#dcf1e3; --fail:#b9282b; --fail-bg:#f9dede; --half:#9a5b00; --half-bg:#fbedcf;
  --wait:#8f98a6; --scrim:rgba(0,0,0,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sync{font-size:14px;color:var(--sub)}
.sync.ok{color:var(--pass)} .sync.bad{color:var(--fail)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px;border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.5px}
header .date{color:var(--sub);font-size:clamp(15px,1.5vw,20px)}
header .clock{margin-left:auto;font-size:clamp(28px,3.6vw,46px);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
header .btns{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit}
header button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer;min-height:44px}
header button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
button:focus-visible,td.cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding-block:16px}
main>section{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{margin:0 0 8px;font-size:18px;color:var(--gold)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tl li{display:flex;gap:12px;padding:9px 10px;border-radius:10px;font-size:18px;align-items:baseline}
.tl li .t{min-width:56px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub)}
.tl li.done{opacity:.4}
.tl li.now{background:var(--gold);color:var(--on-gold)}
.tl li.now .t{color:var(--on-gold)}
.tl small{display:block;font-size:13px;opacity:.85}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum .k{font-size:15px;color:var(--sub)}
.sum .v{font-size:clamp(16px,1.7vw,24px);font-weight:800;margin-top:2px;line-height:1.35}
.sum .p{color:var(--pass)} .sum .f{color:var(--fail)} .sum .n{font-size:15px;color:var(--sub);font-weight:600}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 5px}
th{font-size:15px;color:var(--sub);text-align:center;font-weight:700;padding:0 6px}
th:first-child{text-align:left}
th small{font-weight:600}
td{background:var(--panel);padding:5px 6px;text-align:center;font-size:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td:first-child{text-align:left;font-weight:800;border-left:1px solid var(--line);border-radius:10px 0 0 10px;padding-left:14px;font-size:clamp(18px,2vw,24px);white-space:nowrap}
td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.badge{display:inline-flex;align-items:baseline;gap:6px;min-width:110px;justify-content:center;padding:4px 10px;border-radius:999px;font-weight:800;font-size:clamp(16px,1.7vw,20px)}
.badge.p{background:var(--pass-bg);color:var(--pass)}
.badge.f{background:var(--fail-bg);color:var(--fail)}
.badge.h{background:var(--half-bg);color:var(--half)}
.sum .h{color:var(--half)}
.badge.w{color:var(--wait)}
.badge small{font-weight:600;font-size:14px;opacity:.9}
table.edit td.cell{cursor:pointer}
table.edit td.cell:hover{outline:2px solid var(--gold);outline-offset:-2px}
.hint{color:var(--sub);font-size:15px;margin-top:6px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pick button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:16px;min-height:42px;cursor:pointer}
.pick button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
table.only th.c:not(.sel), table.only td.cell:not(.sel){display:none}
.edrow{display:flex;gap:6px;align-items:center;justify-content:center}
.edrow .in{width:4.2em;font-size:22px;padding:6px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;font-family:inherit;min-height:44px}
.edrow .in.re,.edrow .in.fx{width:4.6em;font-size:17px}
.edrow .allok{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass);border-radius:8px;padding:6px 8px;font-size:15px;font-weight:800;min-height:44px;cursor:pointer;white-space:nowrap}
.badge.rp{background:var(--pass-bg);color:var(--pass);outline:2px solid var(--pass)}
.badge.rf{background:var(--fail-bg);color:var(--fail);outline:2px solid var(--fail)}
.badge.x{background:var(--fail-bg);color:var(--fail);outline:2px dashed var(--fail)}
.edrow .live{cursor:pointer}
.edrow .badge{min-width:76px}
/* 입력 창 (페이지 안에 그리는 창 — 알림창은 쓰지 않는다) */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,100%)}
.card h3{margin:0 0 4px;font-size:24px}
.card p{margin:0 0 10px;color:var(--sub)}
.card label{display:block;font-size:15px;color:var(--sub);margin:10px 0 4px}
.card input,.card textarea{width:100%;font-size:26px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.card textarea{font-size:17px;height:180px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button{flex:1;font-size:18px;min-height:50px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.row .ok{background:var(--pass);color:#fff;border:none}
.row .no{background:var(--fail);color:#fff;border:none}
.row .half{background:var(--half);color:#1b1205;border:none}
.row .warn{color:var(--fail)}
@media (max-width:760px){main{grid-template-columns:1fr}.summary{grid-template-columns:1fr}
  body.editing .panel, body.editing .summary{display:none}
  header h1{font-size:20px} header .date{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header>
  <h1>중3 토요일 · 7과 TEST</h1>
  <span class="date" id="date"></span>
  <span class="clock" id="clock"></span>
  <div class="btns">
    <button id="modeBtn" type="button">입력 모드</button>
    <button id="themeBtn" type="button">밝게</button>
    <button id="setBtn" type="button">설정</button>
    <button id="copyBtn" type="button">결과 복사</button>
  </div>
  <span class="sync" id="sync">시스템 연동 대기</span>
</header>
<main>
  <section class="panel" aria-label="오늘 순서">
    <h2>오늘 순서</h2>
    <ul class="tl" id="tl"></ul>
  </section>
  <section>
    <div class="summary" id="summary"></div>
    <div class="pick" id="pick" aria-label="보여줄 시험"></div>
    <div class="wrap"><table id="board"><thead></thead><tbody></tbody></table></div>
    <div class="hint" id="hint"></div>
  </section>
</main>

<div class="modal" id="dlg" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <h3 id="dTitle"></h3>
    <p id="dSub"></p>
    <label for="dScore">점수 (기준 <span id="dCut"></span>점 이상 통과)</label>
    <input id="dScore" type="number" inputmode="numeric" min="0" max="100">
    <label for="dRetest">재시 점수 (있을 때만)</label>
    <input id="dRetest" type="number" inputmode="numeric" min="0" max="100">
    <div class="row">
      <button class="ok" id="dPass" type="button">통과</button>
      <button class="half" id="dHalf" type="button">틀린 문항 재시</button>
      <button class="no" id="dFail" type="button">전체 재시</button>
    </div>
    <div class="row">
      <button id="dClear" type="button">비우기</button>
      <button id="dCancel" type="button">닫기</button>
      <button class="ok" id="dSave" type="button">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="settings" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h3 id="sTitle">설정</h3>
    <label for="sRoster">학생 명단 (한 줄에 한 명)</label>
    <textarea id="sRoster"></textarea>
    <label for="sCut">통과 기준 점수 — 워크북1 · 워크북2 · 영작</label>
    <input id="sCut" type="text">
    <div class="row">
      <button class="warn" id="sReset" type="button">결과 전부 지우기</button>
      <button id="sCancel" type="button">닫기</button>
      <button class="ok" id="sSave" type="button">저장</button>
    </div>
  </div>
</div>

<script>
const KEY = "daol105_g9_sat_20261024_v2";
const TESTS = [
  { id: "wb1", name: "7과 워크북1 TEST" },
  { id: "wb2", name: "7과 워크북2 TEST" },
  { id: "eng", name: "7과 영작 TEST" },
];
const TIMELINE = [
  ["16:00", "17:00", "7과 워크북1 TEST", "1시간"],
  ["17:00", "18:00", "7과 워크북2 TEST", "1시간"],
  ["18:00", "19:00", "7과 영작 TEST", "1시간"],
  ["19:00", "19:20", "고등서술형 2과 워크북", "20분"],
  ["19:20", "20:00", "채점 → 상세해설서 보고 질답", "모르는 문항 질문"],
  ["20:30", "20:50", "재시", "매시 30분"],
  ["21:30", "21:50", "재시", "매시 30분"],
];
const DEFAULT_ROSTER = ["김서율", "김서하", "김영경", "박세현", "선예진", "신하람", "오재원", "우채원",
  "이효인", "임주원", "정기훈", "최아인", "최정원", "최주원"];

const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const write = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장이 막힌 환경 — 화면은 그대로 동작 */ } };
const load = () => { try { return JSON.parse(read(KEY)) || null; } catch (e) { return null; } };

let state = load() || { roster: DEFAULT_ROSTER, cut: [80, 80, 80], res: {} };
let edit = false;
let cur = null;
let resetArmed = false;
const $ = (id) => document.getElementById(id);

function save() { write(KEY, JSON.stringify(state)); render(); }
window.addEventListener("storage", (e) => { if (e.key === KEY) { state = load() || state; render(); } });

const hm = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const disp = (s) => { const [h, m] = s.split(":").map(Number); return `${h > 12 ? h - 12 : h}:${String(m).padStart(2, "0")}`; };
const has = (v) => v !== "" && v != null;

// 원장 기준(10/24): 80점 이상 통과 · 60~79점 틀린 문항만 재시 · 60점 미만 전체 재시
const FULL_CUT = 60;
const TIER = { p: "통과", h: "틀린 문항 재시", f: "전체 재시", rp: "재시 통과", rf: "재시 불통" };
const tierOf = (score, cut) => (score >= cut ? "p" : score >= FULL_CUT ? "h" : "f");
const okScore = (v) => has(v) && /^\d{1,3}$/.test(String(v).trim()) && Number(v) <= 100;
const okCount = (v) => has(v) && /^\d{1,3}$/.test(String(v).trim());
const PASSED = (t) => t === "p" || t === "rp";
// 판정 순서: 본시험 점수 → (60점 미만) 전체 재시 점수 / (60~79점) 틀린 문항 재시 결과 → 감독 판정이 있으면 그것이 우선
function status(name, i) {
  const r = (state.res[name] || {})[TESTS[i].id];
  if (!r) return null;
  const cut = Number(state.cut[i]);
  let first = null, tier = null;
  if (has(r.score)) first = okScore(r.score) ? tierOf(Number(r.score), cut) : "x";
  tier = first;
  if (first === "f" && has(r.retest)) tier = !okScore(r.retest) ? "x" : (Number(r.retest) >= cut ? "rp" : "rf");
  if (first === "h" && has(r.fix)) tier = !okCount(r.fix) ? "x" : (Number(r.fix) === 0 ? "rp" : "rf");
  if (r.force) tier = r.force;
  if (!tier) return null;
  return { tier, first, pass: PASSED(tier), r };
}
// 화면 · 시스템 오픈메모에 같이 쓰는 설명 — 「72점 → 틀린 문항 재시 다 맞음 · 재시 통과」
function desc(n, i) {
  const s = status(n, i);
  if (!s || s.tier === "x") return "";
  const r = s.r, parts = [];
  if (has(r.score)) parts.push(`${r.score}점`);
  if (s.first === "f" && has(r.retest)) parts.push(`전체 재시 ${r.retest}점`);
  if (s.first === "h" && has(r.fix)) parts.push(Number(r.fix) === 0 ? "틀린 문항 재시 다 맞음" : `틀린 문항 재시 ${r.fix}개 또 틀림`);
  return `${parts.join(" → ")} · ${TIER[s.tier]}${r.force ? " (감독 판정)" : ""}`;
}

function badge(n, i, short) {
  const s = status(n, i);
  if (!s) return `<span class="badge w">${short ? "—" : "대기"}</span>`;
  if (s.tier === "x") return `<span class="badge x">점수 확인</span>`;
  const d = desc(n, i).split(" · ")[0];
  return `<span class="badge ${s.tier}">${TIER[s.tier]}${short ? "" : ` <small>${d}</small>`}</span>`;
}
// 칸 안에서 보일 입력 — 본시험 60점 미만이면 전체 재시 점수, 60~79점이면 다 맞음 / 또 틀린 개수
function showExtras(n, i) {
  const r = cellRec(n, i), cut = Number(state.cut[i]);
  const first = has(r.score) && okScore(r.score) ? tierOf(Number(r.score), cut) : null;
  const q = (f) => document.querySelector(`input[data-n="${n}"][data-i="${i}"][data-f="${f}"]`);
  const re = q("retest"), fx = q("fix"), ok = document.querySelector(`.allok[data-n="${n}"][data-i="${i}"]`);
  if (re) re.hidden = first !== "f";
  if (fx) fx.hidden = first !== "h";
  if (ok) ok.hidden = first !== "h";
}

function renderClock() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  $("clock").textContent = now.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
  $("date").textContent = now.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
  $("tl").innerHTML = TIMELINE.map(([a, b, t, n]) => {
    const cls = mins >= hm(b) ? "done" : (mins >= hm(a) ? "now" : "");
    return `<li class="${cls}"><span class="t">${disp(a)}</span><span>${t}<small>${disp(a)}~${disp(b)} · ${n}</small></span></li>`;
  }).join("");
}

// 휴대폰처럼 좁은 화면에서는 시험 하나씩 골라 입력한다
let focusI = window.innerWidth < 760 ? 0 : -1;
function renderPick() {
  const opts = [...TESTS.map((t, i) => [i, t.name.replace("7과 ", "").replace(" TEST", "")]), [-1, "전체"]];
  $("pick").innerHTML = opts.map(([i, l]) =>
    `<button type="button" data-p="${i}" class="${focusI === i ? "on" : ""}">${l}</button>`).join("");
}
$("pick").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]");
  if (b) { focusI = Number(b.dataset.p); render(); }
});

function render() {
  renderClock();
  renderPick();
  const sel = (i) => (focusI === i ? " sel" : "");
  document.querySelector("#board thead").innerHTML =
    `<tr><th>이름</th>${TESTS.map((t, i) => `<th class="c${sel(i)}">${t.name}<br><small>${state.cut[i]}점 통과</small></th>`).join("")}</tr>`;
  $("board").className = (edit ? "edit" : "") + (focusI >= 0 ? " only" : "");
  document.body.classList.toggle("editing", edit);
  document.querySelector("#board tbody").innerHTML = state.roster.map((n) => {
    const cells = TESTS.map((t, i) => {
      if (!edit) return `<td class="cell${sel(i)}" data-n="${n}" data-i="${i}">${badge(n, i)}</td>`;
      const r = (state.res[n] || {})[t.id] || {};
      return `<td class="cell ed${sel(i)}" data-n="${n}" data-i="${i}"><div class="edrow">` +
        `<input class="in" data-n="${n}" data-i="${i}" data-f="score" type="number" inputmode="numeric" min="0" max="100" placeholder="점수" value="${r.score ?? ""}" aria-label="${n} ${t.name} 점수">` +
        `<input class="in re" data-n="${n}" data-i="${i}" data-f="retest" type="number" inputmode="numeric" min="0" max="100" placeholder="재시점수" value="${r.retest ?? ""}" aria-label="${n} ${t.name} 전체 재시 점수">` +
        `<button type="button" class="allok" data-n="${n}" data-i="${i}">다 맞음</button>` +
        `<input class="in fx" data-n="${n}" data-i="${i}" data-f="fix" type="number" inputmode="numeric" min="0" placeholder="또 틀림" value="${r.fix ?? ""}" aria-label="${n} ${t.name} 틀린 문항 재시에서 또 틀린 개수">` +
        `<span class="live" data-n="${n}" data-i="${i}">${badge(n, i, true)}</span></div></td>`;
    }).join("");
    return `<tr><td>${n}</td>${cells}</tr>`;
  }).join("");
  if (edit) state.roster.forEach((n) => TESTS.forEach((_, i) => showExtras(n, i)));
  renderSummary();
}

function renderSummary() {
  $("summary").innerHTML = TESTS.map((t, i) => {
    let p = 0, h = 0, f = 0, rf = 0;
    state.roster.forEach((n) => {
      const s = status(n, i);
      if (!s) return;
      if (PASSED(s.tier)) p++; else if (s.tier === "h") h++; else if (s.tier === "f") f++; else if (s.tier === "rf") rf++;
    });
    return `<div class="sum"><div class="k">${t.name}</div><div class="v"><span class="p">통과 ${p}</span> · <span class="h">틀린 문항 재시 ${h}</span> · <span class="f">전체 재시 ${f}</span>${rf ? ` · <span class="f">재시 불통 ${rf}</span>` : ""} <span class="n">/ ${state.roster.length}명</span></div></div>`;
  }).join("");

  $("modeBtn").textContent = edit ? "입력 끝내기" : "입력 모드";
  $("modeBtn").classList.toggle("on", edit);
  $("hint").textContent = edit
    ? "본시험 점수를 넣으면 바로 판정됩니다. 60점 미만 → 「재시점수」 칸에 전체 재시 점수(80점 이상 재시 통과). 60~79점 → 틀린 문항만 다시 보고 다 맞으면 「다 맞음」(재시 통과), 또 틀리면 「또 틀림」에 개수(재시 불통). 판정 표시를 누르면 감독이 직접 정할 수 있습니다."
    : "80점 이상 통과 · 60~79점 틀린 문항만 재시 · 60점 미만 전체 재시 — 재시는 매시 30분 (8:30 · 9:30)";
}

// 표 안에서 바로 입력 — 칸을 다시 그리지 않아 다음 칸으로 넘어가도 입력이 끊기지 않는다
function cellRec(n, i) { return { ...((state.res[n] || {})[TESTS[i].id] || {}) }; }
function setRec(n, i, rec) {
  state = { ...state, res: { ...state.res, [n]: { ...(state.res[n] || {}), [TESTS[i].id]: rec } } };
}
document.addEventListener("input", (e) => {
  const el = e.target.closest("input.in");
  if (!el) return;
  const n = el.dataset.n, i = Number(el.dataset.i);
  const rec = { ...cellRec(n, i), [el.dataset.f]: el.value };
  delete rec.force;
  setRec(n, i, rec);
  document.querySelector(`.live[data-n="${n}"][data-i="${i}"]`).innerHTML = badge(n, i, true);
  showExtras(n, i);
  renderSummary();
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button.allok");
  if (!b) return;
  const n = b.dataset.n, i = Number(b.dataset.i);
  const rec = { ...cellRec(n, i), fix: "0" };
  delete rec.force;
  setRec(n, i, rec);
  const fx = document.querySelector(`input[data-n="${n}"][data-i="${i}"][data-f="fix"]`);
  if (fx) fx.value = "0";
  document.querySelector(`.live[data-n="${n}"][data-i="${i}"]`).innerHTML = badge(n, i, true);
  showExtras(n, i);
  renderSummary();
  write(KEY, JSON.stringify(state));
  relay(n, i, cellRec(n, i));
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("input.in");
  if (!el) return;
  const n = el.dataset.n, i = Number(el.dataset.i);
  write(KEY, JSON.stringify(state));
  relay(n, i, cellRec(n, i));
});
document.addEventListener("keydown", (e) => {
  const el = e.target.closest && e.target.closest("input.in");
  if (el && e.key === "Enter") { e.preventDefault(); el.blur(); }
});

function openCell(td) {
  cur = { n: td.dataset.n, i: Number(td.dataset.i) };
  const r = (state.res[cur.n] || {})[TESTS[cur.i].id] || {};
  $("dTitle").textContent = cur.n;
  $("dSub").textContent = TESTS[cur.i].name;
  $("dCut").textContent = state.cut[cur.i];
  $("dScore").value = r.score ?? "";
  $("dRetest").value = r.retest ?? "";
  $("dlg").hidden = false;
  $("dScore").focus();
}
$("board").addEventListener("click", (e) => {
  const live = e.target.closest(".live");
  if (edit && live) openCell(live);
});
$("board").addEventListener("keydown", (e) => {
  const live = e.target.closest(".live");
  if (edit && live && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCell(live); }
});
// 시스템 수업일지 오픈메모로 보내는 중계 — 이름 대신 명단 번호만 보낸다
const RELAY = "https://ntfy.sh/daol105-g9sat-q7k2m9x4v1";
async function relay(n, i, rec) {
  const k = DEFAULT_ROSTER.indexOf(n);
  const st = rec ? status(n, i) : null;
  if (st && st.tier === "x") { $("sync").textContent = `${n} 점수를 확인해 주세요 (0~100)`; $("sync").className = "sync bad"; return; }
  const body = JSON.stringify({ k: k >= 0 ? k : n, id: TESTS[i].id, s: rec ? (rec.score ?? "") : "", r: rec ? (rec.retest ?? "") : "",
    z: rec ? (rec.fix ?? "") : "", f: rec ? (rec.force || "") : "", c: state.cut[i], x: st ? 0 : 1,
    v: st ? TIER[st.tier] : "", d: st ? desc(n, i) : "" });
  // 요청이 몰리면 연동 통로가 잠깐 막는다(429) — 3초 · 6초 · 12초 … 기다렸다 다시 보낸다
  for (let k = 0, wait = 3000; k < 6; k++, wait *= 2) {
    try {
      const res = await fetch(RELAY, { method: "POST", body });
      if (res.ok) {
        $("sync").textContent = `시스템 전송 ✓ ${new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" })}`;
        $("sync").className = "sync ok";
        return;
      }
    } catch (e) { /* 인터넷이 끊겼으면 아래에서 다시 시도 */ }
    $("sync").textContent = `전송 대기 중 — ${n} 다시 보내는 중`; $("sync").className = "sync bad";
    await new Promise((r) => setTimeout(r, wait));
  }
  $("sync").textContent = `⚠ ${n} 시스템 전송 실패 — 그 칸을 한 번 더 입력해 주세요`; $("sync").className = "sync bad";
}
// 다른 기기(휴대폰 · 태블릿)에서 넣은 결과를 받아 이 화면에 반영 — 처음 열면 오늘 기록 전체를 다시 받는다
const seenEv = new Set();
let since = "12h";
function applyRemote(m) {
  const n = typeof m.k === "number" ? DEFAULT_ROSTER[m.k] : m.k;
  const i = TESTS.findIndex((t) => t.id === m.id);
  if (!n || i < 0) return;
  if (m.x) {
    const mine = { ...(state.res[n] || {}) }; delete mine[TESTS[i].id];
    state = { ...state, res: { ...state.res, [n]: mine } };
  } else {
    const rec = { score: m.s ?? "", retest: m.r ?? "", fix: m.z ?? "" };
    if (m.f) rec.force = m.f;
    setRec(n, i, rec);
  }
}
async function pull() {
  try {
    const t = await (await fetch(`${RELAY}/json?poll=1&since=${since}`, { cache: "no-store" })).text();
    let changed = false;
    t.split("\n").filter(Boolean).forEach((ln) => {
      const ev = JSON.parse(ln);
      if (ev.event !== "message" || seenEv.has(ev.id)) return;
      seenEv.add(ev.id); since = ev.id;
      try { applyRemote(JSON.parse(ev.message)); changed = true; } catch (e) { /* 형식이 다른 메시지는 건너뜀 */ }
    });
    if (changed) {
      write(KEY, JSON.stringify(state));
      const typing = document.activeElement && document.activeElement.classList.contains("in");
      if (typing) renderSummary(); else render();
    }
    $("sync").textContent = `연동 중 ✓ ${new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" })}`;
    $("sync").className = "sync ok";
  } catch (e) {
    $("sync").textContent = "연동 끊김 — 인터넷 확인"; $("sync").className = "sync bad";
  }
}

function put(extra) {
  const id = TESTS[cur.i].id;
  const rec = { ...cellRec(cur.n, cur.i), score: $("dScore").value, retest: $("dRetest").value, ...extra };
  if (!extra.force) delete rec.force;
  state = { ...state, res: { ...state.res, [cur.n]: { ...(state.res[cur.n] || {}), [id]: rec } } };
  $("dlg").hidden = true; save(); relay(cur.n, cur.i, rec);
}
$("dSave").onclick = () => put({});
$("dPass").onclick = () => put({ force: "p" });
$("dFail").onclick = () => put({ force: "f" });
$("dHalf").onclick = () => put({ force: "h" });
$("dCancel").onclick = () => { $("dlg").hidden = true; };
$("dClear").onclick = () => {
  const id = TESTS[cur.i].id;
  const mine = { ...(state.res[cur.n] || {}) }; delete mine[id];
  state = { ...state, res: { ...state.res, [cur.n]: mine } }; $("dlg").hidden = true; save(); relay(cur.n, cur.i, null);
};
$("dlg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); put({}); }
  if (e.key === "Escape") $("dlg").hidden = true;
});

const keepAwake = async () => { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) { /* 허용 안 되면 그대로 */ } };
$("modeBtn").onclick = () => { edit = !edit; keepAwake(); render(); };
document.addEventListener("keydown", (e) => {
  if ((e.key === "e" || e.key === "E") && $("dlg").hidden && $("settings").hidden) { edit = !edit; render(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

const applyTheme = (t) => {
  if (t === "light") document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = t === "light" ? "어둡게" : "밝게";
};
applyTheme(read(KEY + "_theme"));
$("themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  applyTheme(t); write(KEY + "_theme", t);
};

$("setBtn").onclick = () => {
  $("sRoster").value = state.roster.join("\n");
  $("sCut").value = state.cut.join(", ");
  resetArmed = false; $("sReset").textContent = "결과 전부 지우기";
  $("settings").hidden = false;
};
$("sCancel").onclick = () => { $("settings").hidden = true; };
$("sSave").onclick = () => {
  const roster = $("sRoster").value.split("\n").map((x) => x.trim()).filter(Boolean);
  const cut = $("sCut").value.split(/[,\s]+/).filter(Boolean).map(Number);
  state = { ...state, roster, cut: TESTS.map((_, i) => (isNaN(cut[i]) ? 80 : cut[i])) };
  $("settings").hidden = true; save();
};
$("sReset").onclick = () => {
  if (!resetArmed) { resetArmed = true; $("sReset").textContent = "한 번 더 누르면 지웁니다"; return; }
  state = { ...state, res: {} }; $("settings").hidden = true; save();
};

// 연동이 끊겼을 때 — 결과 전체를 글로 복사해 Claude 에게 붙여 넣으면 시스템에 한 번에 넣는다
function resultText() {
  const lines = [`[중3 토요일 TEST 결과 ${new Date().toLocaleString("ko-KR")}]`];
  state.roster.forEach((n) => {
    const parts = TESTS.map((t, i) => { const d = desc(n, i); return d ? `${t.name.replace("7과 ", "").replace(" TEST", "")} ${d}` : ""; }).filter(Boolean);
    if (parts.length) lines.push(`${n} : ${parts.join(" / ")}`);
  });
  return lines.join("\n");
}
$("copyBtn").onclick = async () => {
  const txt = resultText();
  try { await navigator.clipboard.writeText(txt); $("copyBtn").textContent = "복사됨 ✓"; }
  catch (e) {
    $("sRoster").value = txt; $("settings").hidden = false; $("sRoster").select();
    $("copyBtn").textContent = "길게 눌러 복사";
  }
  setTimeout(() => { $("copyBtn").textContent = "결과 복사"; }, 3000);
};

render();
setInterval(() => { if (edit) renderClock(); else render(); }, 20000);
// 연결 하나를 열어 두고 새 결과를 밀어 받는다(3초마다 묻지 않아 요청 제한에 걸리지 않는다). 끊기면 브라우저가 다시 잇는다
function onEvent(ev) {
  if (ev.event !== "message" || seenEv.has(ev.id)) return false;
  seenEv.add(ev.id); since = ev.id;
  try { applyRemote(JSON.parse(ev.message)); return true; } catch (e) { return false; }
}
function afterRemote() {
  write(KEY, JSON.stringify(state));
  const typing = document.activeElement && document.activeElement.classList.contains("in");
  if (typing) renderSummary(); else render();
}
if ("EventSource" in window) {
  const es = new EventSource(`${RELAY}/sse?since=12h`);
  es.onmessage = (m) => { try { if (onEvent(JSON.parse(m.data))) afterRemote(); } catch (e) { /* 무시 */ } };
  es.onopen = () => { $("sync").textContent = "연동 중 ✓"; $("sync").className = "sync ok"; };
  es.onerror = () => { $("sync").textContent = "연동 다시 잇는 중…"; $("sync").className = "sync bad"; };
} else {
  pull(); setInterval(pull, 20000);
}
</script>

</body>
</html>
